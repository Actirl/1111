name: XHDLook Unified ReShade + Injector + Shader Build
on:
  workflow_dispatch:
  push:
    branches: [xhd-injector-build-test]
    paths:
      - 'xhd-injector/src/**'
      - 'xhd-injector/reshade-addon/**'
      - 'xhd-injector/shader-test/**'
      - 'xhd-injector/tools/**'
      - '.github/workflows/xhdlook-unified-test.yml'
permissions:
  contents: read
jobs:
  shader-preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual first-prototype replacement CSO independently
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path shader-dist -Force | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$fxc) { throw 'fxc.exe not installed' }
          & $fxc /nologo /T ps_5_0 /E Main /I 'xhd-injector/shader-test' /Fo 'shader-dist/replacement.cso' 'xhd-injector/shader-test/xhdlook_scene_ibl_probe.hlsl'
          if ($LASTEXITCODE -ne 0) { throw 'First prototype HLSL compile failed' }
          python xhd-injector/tools/check_scene_aux.py 'shader-dist/replacement.cso' --ibl --shadow
          if ($LASTEXITCODE -ne 0) { throw 'First prototype shader ABI check failed' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: XHDLook-First-Shader-CSO
          path: shader-dist/replacement.cso
          if-no-files-found: error
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          path: third_party/reshade
      - uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          path: third_party/imgui
          ref: v1.92.5-docking
      - name: Compile injector and ReShade add-on
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          cmake -S xhd-injector -B build/injector -A x64 *>&1 | Tee-Object diagnostics/injector-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Injector CMake configure failed' }
          cmake --build build/injector --config Release --parallel *>&1 | Tee-Object diagnostics/injector-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Injector build failed' }
          cmake -S xhd-injector/reshade-addon -B build/addon -A x64 *>&1 | Tee-Object diagnostics/addon-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Add-on CMake configure failed' }
          cmake --build build/addon --config Release --parallel *>&1 | Tee-Object diagnostics/addon-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Add-on build failed' }
      - name: Compile HLSL and package isolated diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$fxc) { throw 'fxc.exe not installed' }
          $stage='dist/XHDLook-Bridge-Test'
          New-Item -Path $stage -ItemType Directory -Force | Out-Null
          & $fxc /nologo /T ps_5_0 /E Main /I 'xhd-injector/shader-test' /Fo "$stage/replacement.cso" 'xhd-injector/shader-test/xhdlook_scene_ibl_probe.hlsl' *>&1 | Tee-Object diagnostics/shader-fxc.log
          if ($LASTEXITCODE -ne 0) { throw 'HLSL compilation failed' }
          $shader=[IO.File]::ReadAllBytes("$stage/replacement.cso")
          if ($shader.Length -lt 36 -or [Text.Encoding]::ASCII.GetString($shader,0,4) -ne 'DXBC') {throw 'Compiled DXBC invalid'}
          python xhd-injector/tools/check_scene_aux.py "$stage/replacement.cso" --ibl --shadow *>&1 | Tee-Object diagnostics/shader-abi.log
          if ($LASTEXITCODE -ne 0) {throw 'Shader ABI gate failed'}
          Copy-Item 'build/injector/Release/XHDEyeInjector.dll' "$stage/XHDEyeInjector.dll"
          Copy-Item 'build/addon/Release/XHDLookControl.addon64' "$stage/XHDLookControl.addon64"
          @('[settings]','enable_replacement=1','neutralize_t3=0','suppress_ibl_t10_t11=0') | Set-Content "$stage/xhd_injector.ini" -Encoding ascii
          @('BUILD OUTPUT ONLY - NOT AN INSTALLABLE MOD.','Injector loading configuration depends on the actual DivaModLoader version; no config.toml is generated.','Experimental t19 shadow + t9/t10/t11 IBL + approximate SV_Target1; may break rendering. DO NOT install without ABI review.','The updated injector preserves the original shader and switches per draw when the bridge is ON. Requires working DrawIndexed hook.','This artifact only checks that all three components compile.') | Set-Content "$stage/README.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath 'dist/XHDLook-Bridge-Test.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: XHDLook-Unified-First-Prototype
          path: dist/XHDLook-Bridge-Test.zip
          if-no-files-found: error

      - name: Upload compilation diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XHDLook-First-Prototype-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
