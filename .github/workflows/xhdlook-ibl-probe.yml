name: XHDLook IBL Probe Compile Only
on:
  workflow_dispatch:
  push:
    branches: [xhd-injector-build-test]
    paths:
      - 'xhd-injector/shader-test/xhdlook_scene_ibl_probe.hlsl'
      - 'xhd-injector/shader-test/xhd_pc_aux_mrt.hlsli'
      - 'xhd-injector/shader-test/xhd_pc_lighting_kernels.hlsli'
      - '.github/workflows/xhdlook-ibl-probe.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile experimental IBL and auxiliary MRT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$fxc) { throw 'fxc.exe not found' }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          & $fxc /nologo /T ps_5_0 /E Main /I xhd-injector/shader-test /Fo out/scene_ibl_probe.cso xhd-injector/shader-test/xhdlook_scene_ibl_probe.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'HLSL compilation failed' }
          python xhd-injector/tools/check_scene_aux.py out/scene_ibl_probe.cso --ibl
          if ($LASTEXITCODE -ne 0) { throw 'Structural preflight failed' }
          'EXPERIMENTAL ONLY: source uses unverified cubemap directions/LOD and aux MRT. Not a playable mod.' | Set-Content out/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XHDLook-IBL-Probe-Compile-Only
          path: out/
          if-no-files-found: error
