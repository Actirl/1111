name: XHDLook Scene Aux Isolated Compile
on:
  workflow_dispatch:
  push:
    branches: [xhd-injector-build-test]
    paths:
      - 'xhd-injector/shader-test/xhdlook_scene_aux_integration.hlsl'
      - 'xhd-injector/shader-test/xhd_pc_aux_mrt.hlsli'
      - 'xhd-injector/tools/check_scene_aux.py'
      - '.github/workflows/xhdlook-scene-aux.yml'
permissions:
  contents: read
jobs:
  shader:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile HLSL and validate DXBC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$fxc) { throw 'fxc unavailable' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & $fxc /nologo /T ps_5_0 /E Main /I xhd-injector/shader-test /Fo out/scene_aux_test.cso xhd-injector/shader-test/xhdlook_scene_aux_integration.hlsl
          if ($LASTEXITCODE -ne 0) {throw 'FXC failure'}
          python xhd-injector/tools/check_scene_aux.py out/scene_aux_test.cso
          if ($LASTEXITCODE -ne 0) {throw 'DXBC structural validation failed'}
          @('DIAGNOSTIC ONLY; NOT SUITABLE FOR GAME INSTALLATION.','PC aux MRT numeric equivalence and per-material semantics are unverified.','Never rename this file to replacement.cso without additional validation.') | Set-Content out/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XHDLook-Scene-Aux-Compile-Only
          path: out/
          if-no-files-found: error
