name: XHD-Look Eye v3 Windows DXBC Build
on:
  push:
    branches: [xhd-injector-build-test]
    paths:
      - 'xhd-injector/shader-test/xhd_look_eye_v3.hlsl'
      - '.github/workflows/xhd-look-eye-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile injector
        run: |
          cmake -S xhd-injector -B xhd-injector/build -A x64
          cmake --build xhd-injector/build --config Release --parallel
      - name: Compile shader and assemble mod
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$fxc) { throw 'Windows SDK fxc.exe unavailable' }
          $dir = 'dist/XHD_Look_Eye_v3'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & $fxc /nologo /T ps_5_0 /E Main /Fo "$dir/replacement.cso" 'xhd-injector/shader-test/xhd_look_eye_v3.hlsl'
          if ($LASTEXITCODE -ne 0) { throw 'FXC failed' }
          Copy-Item 'xhd-injector/build/Release/XHDEyeInjector.dll' "$dir/XHDEyeInjector.dll"
          @('[settings]','enable_replacement=1','neutralize_t3=0','suppress_ibl_t10_t11=0') | Set-Content "$dir/xhd_injector.ini" -Encoding ascii
          @('enabled = true','dll = ["XHDEyeInjector.dll"]','name = "XHD Look Eye v3 test"','author = "Eye Shader Research"','version = "0.3"') | Set-Content "$dir/config.toml" -Encoding utf8
          @('EXPERIMENTAL: approximates eye look with t0 color remapping; auxiliary RT1 remains approximate.','Backup your previous mod and remove other injector variants before testing.','Not visually verified. Check xhd_shader_observer.log: target and replaced should exceed zero.','Revert by removing this mod folder.') | Set-Content "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path "$dir/*" -DestinationPath 'dist/XHD_Look_Eye_v3.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: XHD-Look-Eye-v3-Test
          path: dist/XHD_Look_Eye_v3.zip
          if-no-files-found: error
