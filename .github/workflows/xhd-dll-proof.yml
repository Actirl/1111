name: XHD D3D11 Shader Observer Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'xhd-injector/**'
      - '.github/workflows/xhd-dll-proof.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S xhd-injector -B xhd-injector/build -A x64
      - name: Compile DLL
        run: cmake --build xhd-injector/build --config Release --parallel
      - name: Verify and package observer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll='xhd-injector/build/Release/XHDEyeInjector.dll'
          if (!(Test-Path $dll)) { throw 'DLL missing' }
          if ((Get-Item $dll).Length -lt 10000) { throw 'DLL unexpectedly small' }
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products * -property installationPath
          $dump=Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (!$dump) { throw 'dumpbin.exe not found' }
          $exports=& $dump.FullName /exports $dll | Out-String
          foreach($name in @('Init','D3DInit','OnFrame')) { if($exports -notmatch "(?m)\s$name\s*$") { throw "Missing export $name" } }
          New-Item -ItemType Directory -Force dist/Observer | Out-Null
          Copy-Item $dll dist/Observer/XHDEyeInjector.dll
          $shader64=''
          [IO.File]::WriteAllBytes((Join-Path (Resolve-Path dist/Observer) 'replacement.cso'),[Convert]::FromBase64String($shader64))
          "[settings]`nenable_replacement=1" | Set-Content dist/Observer/xhd_injector.ini -Encoding ascii
          @'
          enabled = true
          dll = ["XHDEyeInjector.dll"]
          name = "XHD D3D11 Shader Observer"
          author = "XHD experiment"
          version = "0.3"
          description = "Independent DXBC magenta injection visual test; not original XHD shader."
          '@ | Set-Content dist/Observer/config.toml -Encoding utf8
          @'
          EXPERIMENTAL OBSERVER ONLY — not XHD rendering restoration.
          Install as its own DivaModLoader mod. Disable other shader injectors initially.
          This mod attempts visible magenta replacement on the target shader hash; may affect multiple character materials.
          Locate xhd_shader_observer.log beside the DLL after starting the game.
          Expected startup: observer init; unmodified shader mode
          Expected hook: CreatePixelShader observer hook enabled
          Expected periodic: frames=600 hook=1 CreatePS=N target=M replaced=R fail=F
          If no log is created, loader hook/export integration is not verified.
          Do not use together with prior crashing shader mods.
          '@ | Set-Content dist/Observer/README.txt -Encoding utf8
          Compress-Archive -Path dist/Observer/* -DestinationPath dist/XHD_D3D11_Observer_Mod.zip -Force
          if(!(Test-Path dist/XHD_D3D11_Observer_Mod.zip)) {throw 'Package missing'}
      - uses: actions/upload-artifact@v4
        with:
          name: XHD-Independent-Magenta-Visual-Test-Unverified
          path: |
            dist/XHD_D3D11_Observer_Mod.zip
            xhd-injector/build/Release/XHDEyeInjector.dll
          if-no-files-found: error
